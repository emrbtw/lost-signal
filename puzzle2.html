<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LOST SIGNAL // 02</title>
</head>

<body>

  <h1>LOST SIGNAL // 02</h1>

  <p>
    First layer decrypted.
    The second fragment appears heavily encoded.
  </p>

  <pre>
Zm91cg==
  </pre>

  <p>
    Hint: This text was not meant to be read directly.
  </p>

  <input id="answer" placeholder="Enter answer">
  <button onclick="checkAnswer()">Submit</button>

  <p id="result"></p>

  <script>
    async function checkAnswer() {

      const answer =
        document.getElementById("answer")
        .value
        .trim()
        .toLowerCase();

      const res = await fetch(
        "https://tight-thunder-c72a.emreustaoglu616.workers.dev",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            page: "puzzle2",
            answer: answer
          })
        }
      );

      const data = await res.json();

      if (data.correct) {

        document.getElementById("result").innerText =
          "FINAL SIGNAL ACCEPTED. Phase 3 is not yet accessible.";

      } else {

        document.getElementById("result").innerText =
          "Invalid sequence.";

      }
    }
  </script>

</body>
</html>
